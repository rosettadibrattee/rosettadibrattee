version: "3.8"
services:
  api:
    build: ./backend
    volumes:
      - ./backend:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  worker:
    build: ./backend
    volumes:
      - ./backend:/code
    env_file:
      - .env
    command: celery -A app.tasks.celery_app worker --loglevel=info
    depends_on:
      - redis

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
